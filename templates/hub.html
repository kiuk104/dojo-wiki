<!doctype html>
<html lang="ko" data-game="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dojo Wiki — 개인 코딩 위키. 코딩을 배우며 막혔던 것과 알게 된 것.">
<title>Dojo Wiki</title>
<meta name="cd-build" content="{{BUILD}}">
<script>try{var _t=localStorage.getItem('cd-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);var _f=localStorage.getItem('cd-fs');if(_f)document.documentElement.style.setProperty('--fs',_f);}catch(e){}</script>
<script src="shared/fonts.js?v={{V}}"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo Wiki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/fokus.css?v={{V}}">
<style>
.hub{max-width:1040px;margin:0 auto;padding:0 28px 80px;zoom:var(--fs,1)}
.hub-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hub-top .in{max-width:1040px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:8px}
.hub-top .home{font-size:15px}
.hero{padding:56px 0 26px}
.hero .kick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(36px,7vw,58px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--ink2);font-size:15px;max-width:34em}
.gsearch{margin:26px 0 8px;display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line2);border-radius:10px;padding:10px 10px 10px 14px}
.gsearch:focus-within{border-color:var(--acc)}
.gsearch svg{flex:none;color:var(--muted)}
.gsearch input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none}
.gsearch input::placeholder{color:var(--muted)}
.gsearch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 12px}
.sec-h h2{font-family:var(--f-disp);font-size:19px;margin:0}
.sec-h span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card-main{display:flex;gap:14px;align-items:flex-start;padding:18px 18px 14px;border:0;color:var(--ink);flex:1;position:relative}
.cover{flex:none;width:60px;height:90px;border-radius:8px;object-fit:cover;background:var(--surf2);box-shadow:0 1px 3px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.mono{flex:none;width:52px;height:52px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.card-tx{display:flex;flex-direction:column;min-width:0}
.card-en{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.card-name{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.3;margin-top:2px}
.card-title{font-size:13px;color:var(--muted);margin-top:2px}
.card-prog{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.5}
.card-bar{display:block;height:3px;background:var(--surf2);border-radius:2px;margin-top:5px;overflow:hidden;max-width:180px}
.card-bar i{display:block;height:100%;background:var(--acc2);border-radius:2px}
.badge{display:inline-block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:1px 8px;margin-right:8px;vertical-align:1px}
.card-ft{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 18px 13px;border-top:1px solid var(--line);font-size:12.5px}
.card-stat{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:auto}
.card-links{display:flex;gap:10px;flex-wrap:wrap}
.card-links a{border:0;color:var(--acc2);font-weight:500}
.card-links a:hover{text-decoration:underline}
.results{display:grid;gap:8px;margin-top:8px}
.res{display:block;border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:12px 16px;color:var(--ink)}
.res:hover{border-color:var(--acc)}
.res .g{display:inline-block;font-size:11px;font-weight:500;color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.res b{font-family:var(--f-disp);font-size:15.5px}
.res p{margin:5px 0 0;font-size:13px;color:var(--ink2);line-height:1.6}
.res mark{background:var(--amber-soft);color:var(--ink);border-radius:2px;padding:0 1px}
.rmeta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.hub-foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-family:var(--f-mono);line-height:1.8}
@media (max-width:640px){ .hub,.hub-top .in{padding-left:16px;padding-right:16px} .hero{padding-top:36px} .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="hub-top"><div class="in">
  <a class="home" href="./"><img src="icons/icon-192.png" alt=""><span>Dojo Wiki</span></a>
  <span class="tb-sp"></span>
  <button class="btn icon" id="setBtn" aria-label="설정" aria-haspopup="dialog" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div></header>
<div class="setpanel" id="setPanel" role="dialog" aria-label="설정" hidden>
  <div class="sp-row"><span class="sp-lab">테마</span>
    <div class="seg" id="segTheme" role="group" aria-label="테마">
      <button data-v="system">시스템</button><button data-v="light">라이트</button><button data-v="dark">다크</button>
    </div></div>
  <div class="sp-row"><span class="sp-lab">글자 크기</span>
    <div class="seg" id="segFs" role="group" aria-label="글자 크기">
      <button data-v="0.9">작게</button><button data-v="1">보통</button><button data-v="1.12">크게</button><button data-v="1.25">아주 크게</button>
    </div></div>
  <div class="sp-row"><span class="sp-lab">계정</span>
    <div class="sp-acct"><button type="button" id="acctBtn" hidden>구글로 로그인</button><span id="acctInfo">불러오는 중…</span></div></div>
  <div class="sp-row"><span class="sp-lab">앱</span>
    <div class="sp-app"><button type="button" id="reloadBtn">↻ 새로고침</button><span id="buildInfo"></span></div></div>
  <p class="sp-note">테마·글자 크기는 이 기기에 저장되고, 모든 위키 페이지에 같이 적용돼요.</p>
</div>
<main class="hub">
  <section class="hero">
    <div class="kick">개인 코딩 위키 · 분류 {{COUNT}}개</div>
    <h1>Dojo Wiki</h1>
    <p>코딩을 배우다 막힌 곳, 알아낸 해결법, 나만의 규칙을 분류별 노트로 모아 둔 곳. 코딩Dojo와 짝꿍이에요.</p>
    <label class="gsearch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="gq" type="search" placeholder="전체 검색 — 터미널, ENOENT, 이름 규칙…" autocomplete="off" aria-label="전체 검색">
    </label>
  </section>
  <section id="resWrap" hidden>
    <div class="rmeta" id="rmeta"></div>
    <div class="results" id="results"></div>
  </section>
  <section id="gameWrap">
    <div class="sec-h"><h2>분류</h2><span>자주 보는 분류 먼저</span></div>
    <div class="cards">
{{CARDS}}
    </div>
  </section>
  <p class="hub-foot">Dojo Wiki · 개인 코딩 위키<br>각 노트는 마크다운 원본에서 만들어집니다. 원본이 갱신되면 이 사이트도 다시 발행됩니다.</p>
</main>
<script>window.FS_ROOT='';</script>
<script src="shared/core.js?v={{V}}"></script>
<script>
(function(){
  var NAMES={{NAMES}}, q=document.getElementById('gq'), wrap=document.getElementById('resWrap'),
      list=document.getElementById('results'), meta=document.getElementById('rmeta'), games=document.getElementById('gameWrap'),
      data=null, loading=null;
  function load(){ if(data) return Promise.resolve(data); if(!loading) loading=fetch('data/search.json?v={{V}}').then(function(r){return r.json()}).then(function(d){ data=d.map(function(e){ e.l=(e.t+' '+e.x).toLowerCase(); return e; }); return data; }); return loading; }
  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function snip(x,w){ var lx=x.toLowerCase(), i=lx.indexOf(w); if(i<0) return esc(x.slice(0,140))+(x.length>140?'…':'');
    var a=Math.max(0,i-50), b=Math.min(x.length,i+w.length+90);
    return (a?'…':'')+esc(x.slice(a,i))+'<mark>'+esc(x.slice(i,i+w.length))+'</mark>'+esc(x.slice(i+w.length,b))+(b<x.length?'…':''); }
  function run(){
    var v=q.value.trim().toLowerCase();
    if(!v){ wrap.hidden=true; games.hidden=false; return; }
    load().then(function(d){
      if(q.value.trim().toLowerCase()!==v) return;
      var ws=v.split(/\s+/), hit=d.filter(function(e){ return ws.every(function(w){ return e.l.indexOf(w)>-1; }); });
      hit.sort(function(a,b){ return (b.t.toLowerCase().indexOf(ws[0])>-1)-(a.t.toLowerCase().indexOf(ws[0])>-1); });
      meta.textContent=hit.length?('검색 결과 '+hit.length+'개'+(hit.length>50?' · 위 50개만 표시':'')):'검색 결과가 없어요.';
      list.innerHTML=hit.slice(0,50).map(function(e){
        return '<a class="res" data-game="'+e.g+'" href="'+e.g+'/'+(e.p||'guide.html')+'#'+e.h+'"><span class="g">'+esc(NAMES[e.g]||e.g)+'</span><b>'+esc(e.t)+'</b><p>'+snip(e.x,ws[0])+'</p></a>';
      }).join('');
      wrap.hidden=false; games.hidden=true;
    }).catch(function(){ meta.textContent='검색 색인을 불러오지 못했어요.'; wrap.hidden=false; });
  }
  var t=null; q.addEventListener('input',function(){ clearTimeout(t); t=setTimeout(run,120); });
  q.addEventListener('focus',load,{once:true});
  q.addEventListener('keydown',function(e){ if(e.key==='Escape'){ q.value=''; run(); } });
  document.addEventListener('keydown',function(e){ if(e.key==='/'&&document.activeElement!==q){ e.preventDefault(); q.focus(); } });
})();
</script>
<script type="module" src="shared/sync.js?v={{V}}"></script>
</body>
</html>
